name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version with three numeric components (for example, 1.2.3)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CODE_SIGN_IDENTITY: "Developer ID Application: Steve Trefethen (KNB9Z3H239)"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Select release metadata
        id: release-metadata
        env:
          WORKFLOW_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="$WORKFLOW_VERSION"
          else
            release_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release version must contain exactly three numeric components.\n' >&2
            exit 64
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'RELEASE_BUILD=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Configure signing credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: ./scripts/release/ci-keychain.sh setup

      - name: Build, notarize, and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/release/package.sh

      - name: Remove signing credentials
        if: always()
        run: ./scripts/release/ci-keychain.sh cleanup

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kickoff-release
          path: |
            build/release/Kickoff-${{ steps.release-metadata.outputs.version }}-universal.zip
            build/release/Kickoff-${{ steps.release-metadata.outputs.version }}-universal.zip.sha256
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          archive="build/release/Kickoff-$release_version-universal.zip"
          checksum="$archive.sha256"
          mkdir -p build/release
          gh run download "$GITHUB_RUN_ID" --repo "github.com/$GITHUB_REPOSITORY" --name kickoff-release --dir build/release
          test -f "$archive"
          test -f "$checksum"
          if gh release view "$GITHUB_REF_NAME" --repo "github.com/$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release %s already exists; refusing to replace it.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "$checksum" \
            --repo "github.com/$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Kickoff $release_version" \
            --generate-notes
